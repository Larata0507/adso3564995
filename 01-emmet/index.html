            <section>
                <h2 class="subtitle">
                    Child
                    <span></span>

                <p>ul>li>a ↔️</p>

<xmp><ul>
    <li>

    </li>
</ul></xmp>

             <section>
                <h2 class="subtitle">
                   02 Child
                    <span></span>
                </h2>
                <small>Creates sibling elements</small>
                <h3>Example</h3>
                <p>header*section*footer↔️</p>
                <h3>Result:</h3>
<xmp><header></header>
<section></section>
<footer></footer></xmp>
