<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-Tables</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
            thead{
                th{
                    background-color: #e44a26;
                    border: 2px solid #fff9;
                    color: #000;
                    padding: 0.4rem;
                }
            }
        
        tbody{
            tr{
                &:nth-child(even){
                    background-color: #fff3;
                }
            td{
                border: 2px solid #fff9;
                color: #fff9;
                padding: 0.4rem;
            }
        }
    }
    tfoot{
        td{
            background-color: #e44a26;
            border: 2px solid #fff;
            color: #000;
            padding: 0.4rem;
            text-align: center;
        }
    }
}
    
    </style>
    </head>
    <body class="html">
     <nav class="goback">
            <a href="index.html">
                 <svg xmlns=< xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a> 
        </nav>
    <main>
        <header class="mmenu internal">
            <h1>09-Tables</h1>
            <img src="../src/images/logo-html.png" alt="Html">
            <h3>Creates tables for data display.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>FullName</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Homero</td>
                        <td>Homero1234@gmail.com</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Marge</td>
                        <td>Marge1234@gmail.com</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Bart</td>
                        <td>Bart1234@gmail.com</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Lisa</td>
                        <td>Lisa1234@gmail.com</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>Maggie</td>
                        <td>Maggie1234@gmail.com</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Simpson Family</td>
                    </tr>
                </tfoot>
            </table>
        </section>
        </main>
    </body>
</html>
