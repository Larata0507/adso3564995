    <style>
        /* Specifity : 0,0,2 => 2*/
        section button{
            background-color: #ccc;
            border: 2px solid #000;
            border-radius: 0.2rem;
            padding: 0.8rem;
            display: block;
            margin: 2rem auto;
            width: 240px;
        }
        
        /* Specifity : 0,1,2 => 12*/
        section button.green{
            background-color: #59b259;
        }

        /* Specifity : 0,0,1 => 1*/
        button{
            background-color: #dc143c !important;
        }

    </style>
