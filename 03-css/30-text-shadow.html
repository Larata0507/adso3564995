<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt{
                font-size: 4rem;
                font-weight: 600;
                margin: 1rem 0;
                text-align: center;

                &.txt1 {
                    color: #000;
                    text-shadow: 0 0 6px white;
                }
                &.txt2 {
                    color: #000;
                    text-shadow: -4px -4px 4px white;
                }
                &.txt3 {
                    text-shadow: 10px 10px 0 #ffd217, 20px 20px 0 #5ac7ff;
                }
                &.txt4 {
                    color: #fff;
                    letter-spacing: 0.6rem;
                    text-shadow: -5px 0 0 #fcdd09,
                                 -10px 0 0 #078930;
                }
            }
        }
    </style>
    </head>
    <body class="css">
     <nav class="goback">
            <a href="index.html">
                 <svg xmlns=< xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a> 
        </nav>
    <main>
        <header class="mmenu internal">
            <h1>30-Text Shadow</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3> Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
    </body>
</html>
