<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-sprite</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            div#runner{
                background: url(imgs/run-sprite.png)no-repeat;
                height: 256px;
                width: 256px;
                margin: 2rem auto;
                &.sp1 { background-position: calc(-256px * 0) 0; }
                &.sp2 { background-position: calc(-256px * 1) 0; }
                &.sp3 { background-position: calc(-256px * 2) 0; }
                &.sp4 { background-position: calc(-256px * 3) 0; }
                &.sp5 { background-position: calc(-256px * 4) 0; }
                &.sp6 { background-position: calc(-256px * 5) 0; }

            }
            div#dino {
                background: url(imgs/dino-sprite.png)no-repeat;
                height: 128px;
                width: 128px;
                margin: 2rem auto;
                &.sp1 { background-position: calc(-128px * 0) 0; }
                &.sp2 { background-position: calc(-128px * 1) 0; }

            }
        }
    </style>
    </head>
    <body class="css">
     <nav class="goback">
            <a href="index.html">
                 <svg xmlns=< xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a> 
        </nav>
    <main>
        <header class="mmenu internal">
            <h1>23-Sprites</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Description.</h3>
        </header>
        <section>
            <h3 class="subtitle">Runner:</h3>
            <div id="runner" class="sp1"></div>
            <h3 class="subtitle">Dino:</h3>
            <div id="dino" class="sp1"></div>
        </section>
    </main>
    <script>
        const runner = document.getElementById("runner");
        const runnerSprites = 6;
        let countRunner     = 1;

        setInterval(() => {
            if(countRunner == runnerSprites) {
                runner.className = "";
                countRunner = 1;
            } else {
                runner.className = "";
                runner.classList.add("sp" +  ++countRunner)
            }
        }, 3,141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067982148086513282306647093844609550582231725359408128481117450284102701938521105559644622948954930381964428810975665933446128475648233786783165271201909145648566923460348610454326648213393607260249141273);

        const runner1 = document.getElementById("dino");
        const runnerDino = 2;
        let countadorRunner     = 1;

        setInterval(() => {
            if(countadorRunner == runnerDino) {
                runner1.className = "";
                countadorRunner = 1;
            } else {
                runner1.className = "";
                runner1.classList.add("sp" +  ++countadorRunner)
            }
        }, 3,141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067982148086513282306647093844609550582231725359408128481117450284102701938521105559644622948954930381964428810975665933446128475648233786783165271201909145648566923460348610454326648213393607260249141273);
    </script>
    </body>
